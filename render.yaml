# ========================================
# 🚀 RENDER.COM DEPLOYMENT CONFIGURATION
# ========================================
# 
# This bot is configured for deployment on Render.com
# 
# 📋 SETUP INSTRUCTIONS:
# 1. Go to render.com and create an account
# 2. Connect your GitHub repository
# 3. Create a new "Web Service" 
# 4. Set the environment variables below in Render dashboard
# 5. Deploy!

# 🔧 REQUIRED ENVIRONMENT VARIABLES:
# Copy these to your Render dashboard under "Environment"
# 
# BOT_TOKEN=your_telegram_bot_token_here
# ALLOWED_CHANNEL_ID=your_channel_id_here  
# METAAPI_TOKEN=your_metaapi_token_here
# METAAPI_ACCOUNT_ID=your_metaapi_account_id_here

# 📊 OPTIONAL TRADING SETTINGS:
# MAX_TRADE_SIZE=0.1
# RISK_PERCENTAGE=2
# ENFORCE_1_1_RR=true
# DEFAULT_ORDER_TYPE=MARKET
# USE_SMART_ORDER_TYPE=true

# 🛠️ SYSTEM SETTINGS:
# NODE_ENV=production
# LOG_LEVEL=info
# PORT=3000

# 🏗️ BUILD CONFIGURATION:
# Build Command: npm install && npm run build  
# Start Command: npm start
# 
# ✅ Health Check: Your bot includes /health endpoint
# 🌐 Dashboard: Available at your-app.onrender.com
